(function(){'use strict';
// ===================== core: helpers and the game screen =====================
// The whole game is painted in 2D at a low internal resolution (360 rows) and scaled up with hard pixels,
// the way the arcade boards did it: a road raster, then sprites scaled by distance, back to front.
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const sstep = (t) => t * t * (3 - 2 * t);
const angWrap = (a) => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const $ = (id) => document.getElementById(id);
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
// deterministic random numbers: every stage builds the same scenery for every player
function mulberry(seed) {
  let a = seed >>> 0;
  const f = () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  f.range = (lo, hi) => lo + f() * (hi - lo);
  f.int = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  f.chance = (p) => f() < p;
  return f;
}
function strSeed(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i), hash1(i + 1), u); }
function vnoise2(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  return lerp(lerp(hash2(xi, zi), hash2(xi + 1, zi), u), lerp(hash2(xi, zi + 1), hash2(xi + 1, zi + 1), u), v);
}
function fbm1(x) { return vnoise1(x) * 0.55 + vnoise1(x * 2.03 + 7.1) * 0.28 + vnoise1(x * 4.11 + 3.3) * 0.17; }
const fmtTime = (t) => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return m + "'" + String(Math.floor(s)).padStart(2, '0') + '"' + String(Math.floor((s % 1) * 100)).padStart(2, '0'); };
const kmh = (v) => v * 3.6;
const D2R = Math.PI / 180;

// ---------- the screen ----------
const view = $('gl');
const DETAIL = window.FormosaDetailSurface.scale;
const vctx = window.FormosaDetailSurface.context(view, { alpha: false });
const glCanvas = view;     // the touch controls listen on the game screen
const RH = 270;            // logical camera height; the physical surface is 540 rows
let RW = 640;              // internal width follows the shape of the screen
const FOC = 296;           // focal length in game pixels: about 49 degrees of vertical view
let X0 = 320;              // screen centre
const Y0 = 112;            // the horizon line
const PXK = RH / 360;      // backdrop art was laid out for 360 rows
const PANO_W = Math.round(TAU * FOC); // one turn of the horizon in game pixels

// ---------- small helpers ----------
function canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; }
function hexToRgb(hex) { return [((hex >> 16) & 255) / 255, ((hex >> 8) & 255) / 255, (hex & 255) / 255]; }

}
function shadeHex(hex, k) { const A = hexToRgb(hex); return (Math.round(clamp(A[0] * k, 0, 1) * 255) << 16) | (Math.round(clamp(A[1] * k, 0, 1) * 255) << 8) | Math.round(clamp(A[2] * k, 0, 1) * 255); }

const rgbaHex = (hex, a) => 'rgba(' + ((hex >> 16) & 255) + ',' + ((hex >> 8) & 255) + ',' + (hex & 255) + ',' + a.toFixed(3) + ')';

// ===================== road: stage pieces, centreline, forks =====================
// A stage is a list of sections (length, peak curvature, rise, cross-section, what lies on each side).
// A Piece is one stage laid into the world from a start point; forks hang two child pieces off the end.
//
// Cross-section, left to right (x is metres from the centre of the road, + to the right):
//   ground | [left shoulder M][the lanes -W..W, all running our way][scooter lane / shoulder SH] | ground
// The whole road runs one way, the arcade way: every vehicle on it is going where we are going, only slower.
// (M keeps its old name from the days of a median; it is the left shoulder now. O, the oncoming road, is always 0.)
const DS = 2;            // centreline sample spacing (m)
const LANE = 3.5;        // lane width (m)
const FORK_LEN = 300;    // the widened stretch before a split
const DIVERGE_LEN = 460; // the first stretch of each child, bending away from its sibling
const SEC_DEFAULT = { lanes: 3, sh: 2.4, shl: 1.6 };

function curveProfile(t) { return sstep(clamp(t / 0.3, 0, 1)) * sstep(clamp((1 - t) / 0.3, 0, 1)); }

class Piece {
  constructor(stageId, start, opts) {
    const def = STAGES[stageId];
    this.id = stageId; this.def = def; this.opts = opts || {};
    this.side = this.opts.side || 0;           // -1 left child, +1 right child of a fork, 0 plain
    this.parent = this.opts.parent || null;
    this.children = []; this.next = null;      // filled by the route builder
    this.gS = this.opts.gS || 0;               // distance along the route where this piece starts
    this.seed = strSeed(stageId);
    // ---- fill every section's cross-section from the one before it ----
    const stageSecs = [];
    let prev = SEC_DEFAULT;
    for (const s0 of def.sections) {
      const s = Object.assign({}, s0);
      for (const k of ['lanes', 'sh', 'shl']) if (s[k] == null) s[k] = prev[k];
      stageSecs.push(s); prev = s;
    }
    const first = stageSecs[0], last = stageSecs[stageSecs.length - 1];
    // ---- the sections actually laid: a divergence bend for fork children, the stage, a widened fork stretch ----
    const secs = [];
    // a fork child's checkpoint arch stands just past the split, in its divergence bend, not 460 m further on
    if (this.side) secs.push(Object.assign({}, first, { len: DIVERGE_LEN, k: this.side * 0.0016, dy: 0, tags: (first.tags || []).filter((t) => t !== 'start'), diverge: true }));
    for (const s of stageSecs) secs.push(this.side && s === first ? Object.assign({}, s, { tags: (s.tags || []).filter((t) => t !== 'checkpoint') }) : s);
    if (def.children && def.children.length === 2) {
      const cl = STAGES[def.children[0]].sections[0].lanes || 2, cr = STAGES[def.children[1]].sections[0].lanes || 2;
      this.forkLanes = [cl, cr];
      this.forkOff = [-(cr * LANE) / 2, (cl * LANE) / 2];         // child centres relative to ours at the split
      this.forkDiv = ((cl - cr) * LANE) / 2;                       // the line between the two carriageways
      secs.push(Object.assign({}, last, { len: FORK_LEN, k: 0, dy: 0, lanes: cl + cr, tags: ['forksign'], fork: true }));
    }
    this.secs = secs;
    // ---- integrate the centreline ----
    let n = 0; for (const s of secs) n += Math.round(s.len / DS);
    this.N = n + 1; this.L = n * DS;
    const N = this.N;
    this.X = new Float32Array(N); this.Y = new Float32Array(N); this.Z = new Float32Array(N);
    this.H = new Float32Array(N); this.K = new Float32Array(N);
    this.W = new Float32Array(N); this.SH = new Float32Array(N); this.M = new Float32Array(N); this.O = new Float32Array(N);
    this.SEC = new Uint16Array(N); this.F = new Float32Array(N);
    let x = start.x, y = start.y, z = start.z, h = start.h;
    // cross-section state, eased from section to section
    const cs = this.opts.startCS ? Object.assign({}, this.opts.startCS) : { W: (first.lanes * LANE) / 2, SH: first.sh, M: first.shl, O: 0 };
    if (this.side === 1) cs.M = 0;                   // no shoulder on the inner side of a right branch at first
    if (this.side === -1) cs.SH = 0;                 // nor beside the inner edge of a left branch
    this.X[0] = x; this.Y[0] = y; this.Z[0] = z; this.H[0] = h;
    this.W[0] = cs.W; this.SH[0] = cs.SH; this.M[0] = cs.M; this.O[0] = cs.O;
    let idx = 0;
    this.secStartS = [];
    for (let j = 0; j < secs.length; j++) {
      const s = secs[j], m = Math.round(s.len / DS), y0 = y;
      const from = Object.assign({}, cs);
      const to = { W: (s.lanes * LANE) / 2, SH: s.sh, M: s.shl, O: 0 };
      if (s.diverge && this.side === 1) to.M = 0;
      if (s.diverge && this.side === -1) to.SH = 0;
      this.secStartS.push(idx * DS);
      for (let i = 0; i < m; i++) {
        const t = (i + 0.5) / m, kk = (s.k || 0) * curveProfile(t);
        h += kk * DS;
        x += Math.sin(h) * DS; z -= Math.cos(h) * DS;
        y = y0 + (s.dy || 0) * sstep((i + 1) / m) + (s.roll ? s.roll[0] * Math.sin(TAU * s.roll[1] * ((i + 1) / m)) : 0);   // roll: [amp, n] n whole waves inside the section
        const into = (i + 1) * DS;
        const e = s.fork ? sstep(clamp(into / (s.len * 0.55), 0, 1)) : s.diverge ? sstep(clamp(into / (s.len * 0.9), 0, 1)) : sstep(clamp(into / 120, 0, 1));
        cs.W = lerp(from.W, to.W, s.fork ? sstep(clamp(into / (s.len * 0.45), 0, 1)) : e);
        cs.SH = lerp(from.SH, to.SH, e);
        cs.M = lerp(from.M, to.M, e); cs.O = 0;
        if (this.side === -1 && s.diverge) cs.SH = to.SH = lerp(0, first.sh, sstep(clamp((into - 120) / 300, 0, 1)));
        idx++;
        this.X[idx] = x; this.Y[idx] = y; this.Z[idx] = z; this.H[idx] = h; this.K[idx] = kk;
        this.W[idx] = cs.W; this.SH[idx] = cs.SH; this.M[idx] = cs.M; this.O[idx] = cs.O; this.SEC[idx] = j;
        this.F[idx] = s.fork ? sstep(clamp(into / (s.len * 0.5), 0, 1)) : 0;
      }
      if (s.diverge && this.side === -1) cs.SH = first.sh;
    }
    this.K[0] = this.K[1] || 0;
    this.end = { x, y, z, h, cs: Object.assign({}, cs) };
    // scenery, filled by the decorator
    this.colliders = []; this.sprites = []; this.walls = []; this.rails = []; this.wires = []; this.anim = [];
    this.innerFree = null; // for fork children: how far the inner ground may reach before the sibling's
  }
  fi(s) { const f = clamp(s / DS, 0, this.N - 1.0001); const i = Math.floor(f); return [i, f - i]; }
  sec(s) { const [i] = this.fi(s); return this.secs[this.SEC[i]]; }
  at(arr, s) { const [i, t] = this.fi(s); return lerp(arr[i], arr[i + 1], t); }
  heading(s) { if (s < 0 || s > this.L) return s < 0 ? this.H[0] : this.H[this.N - 1]; return this.at(this.H, s); }
  curv(s) { return this.at(this.K, s); }
  hw(s) { return this.at(this.W, s); }
  shoulder(s) { return this.at(this.SH, s); }
  fork(s) { return this.at(this.F, s); }
  // the edges of the paving: beyond either one the ground begins
  leftEdge(s) { return -this.at(this.W, s) - this.at(this.M, s); }
  rightEdge(s) { return this.at(this.W, s) + this.at(this.SH, s); }
  // world point at distance s and lateral offset x (right is +x); straight extrapolation off either end
  pos(s, x, out) {
    out = out || { x: 0, y: 0, z: 0 };
    let px, py, pz, h;
    if (s < 0) { h = this.H[0]; px = this.X[0] + Math.sin(h) * s; py = this.Y[0]; pz = this.Z[0] - Math.cos(h) * s; }
    else if (s > this.L) {
      if (this.next) return this.next.pos(s - this.L, x, out);
      const e = this.N - 1, d = s - this.L; h = this.H[e]; px = this.X[e] + Math.sin(h) * d; py = this.Y[e]; pz = this.Z[e] - Math.cos(h) * d;
    } else {
      const [i, t] = this.fi(s);
      px = lerp(this.X[i], this.X[i + 1], t); py = lerp(this.Y[i], this.Y[i + 1], t); pz = lerp(this.Z[i], this.Z[i + 1], t); h = lerp(this.H[i], this.H[i + 1], t);
    }
    out.x = px + Math.cos(h) * x; out.y = py; out.z = pz + Math.sin(h) * x;
    return out;
  }
  slope(s) { const a = clamp(s - 3, 0, this.L), b = clamp(s + 3, 0, this.L); return b > a ? (this.yAt(b) - this.yAt(a)) / (b - a) : 0; }
  yAt(s) { return this.at(this.Y, s); }
  // outer edges of the paved road on each side (where the ground begins)
  outerL(i) { return -(this.W[i] + this.M[i]); }
  outerR(i) { return this.W[i] + this.SH[i]; }
}

// ---------- the route tree: every stage laid into the world once per path that reaches it ----------
if (window.FORMOSA_ROUTES) window.FORMOSA_ROUTES.apply(STAGES);
const ROUTE = { root: null, pieces: [] };
function layPiece(stageId, start, opts) {
  const p = new Piece(stageId, start, opts);
  ROUTE.pieces.push(p);
  const d = p.def;
  if (d.children) {
    const e = p.end, rx = Math.cos(e.h), rz = Math.sin(e.h), off = p.forkOff, [cl, cr] = p.forkLanes;
    // the left branch keeps the left shoulder, the right one the right shoulder; each grows the other after they part
    const csL = { W: (cl * LANE) / 2, SH: 0, M: e.cs.M, O: 0 };
    const csR = { W: (cr * LANE) / 2, SH: e.cs.SH, M: 0, O: 0 };
    const L = layPiece(d.children[0], { x: e.x + rx * off[0], y: e.y, z: e.z + rz * off[0], h: e.h }, { side: -1, parent: p, startCS: csL, gS: p.gS + p.L });
    const R = layPiece(d.children[1], { x: e.x + rx * off[1], y: e.y, z: e.z + rz * off[1], h: e.h }, { side: 1, parent: p, startCS: csR, gS: p.gS + p.L });
    p.children = [L, R];
    // how far each child's inner ground may reach before meeting its sibling's
    for (const [c, o] of [[L, R], [R, L]]) {
      c.innerFree = new Float32Array(c.N);
      for (let i = 0; i < c.N; i++) {
        const j = Math.min(i, o.N - 1), dx = c.X[i] - o.X[j], dz = c.Z[i] - o.Z[j];
        const sep = Math.sqrt(dx * dx + dz * dz);
        const mine = c.side < 0 ? c.outerR(i) : -c.outerL(i), theirs = o.side < 0 ? o.outerR(j) : -o.outerL(j);
        c.innerFree[i] = Math.max(0, (sep - mine - theirs) / 2 - 0.5);
      }
    }
  } else if (d.next) {
    const e = p.end;
    p.next = layPiece(d.next, { x: e.x, y: e.y, z: e.z, h: e.h }, { parent: p, startCS: e.cs, gS: p.gS + p.L });
  }
  return p;
}

const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

    const i = (y * this.w + x) * 4; this.d[i] = (c >> 16) & 255; this.d[i + 1] = (c >> 8) & 255; this.d[i + 2] = c & 255; this.d[i + 3] = 255;
  }
  clear(x, y) { x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.d[(y * this.w + x) * 4 + 3] = 0; }
  get(x, y) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return -1;
    const i = (y * this.w + x) * 4; if (this.d[i + 3] < 128) return -1;

function paintVSign(text, col, seed) {

// ===================== sprites: the barriers along the road as tiling pixel textures =====================
// A rail is laid as short wall segments, each wearing one tile of its texture, so a balustrade post passes

const RAIL_TEX = {
  balustrade: { L: 2.4, h: 1.0, solid: true }, railing: { L: 2.4, h: 1.1, solid: true }, guard: { L: 4, h: 0.8, solid: true }, concrete: { L: 4, h: 0.8, solid: true }, parapet: { L: 4, h: 1.05, solid: true },

    if (kind === 'balustrade') { px.rect(1, 0, 4, 3, 0xff8a1a); px.set(2, 0, 0xffd080); }

function paintKPMC() {
  const W = 300, H = 320, px = new Pix(W, H);

// ===================== sprites: banners for the arches, fork signs, place signs, painted road words =====================
function paintBanner(top, sub, bg, fg, acc) {
  const W = 240, H = 20, px = new Pix(W, H);
  px.rect(0, 0, W, H, bg); px.rect(0, 0, W, 2, acc); px.rect(0, H - 2, W, 2, acc);
  for (let i = 0; i < W; i += 12) { px.rect(i, 2, 6, 2, shadeHex(bg, 1.3)); }
  px.text(top, 64, 3, 14, fg, { align: 'center', font: '"Russo One",sans-serif', weight: 400, maxW: 120 });
  px.text(sub, 180, 3, 14, fg, { align: 'center', maxW: 100 });
  return px;
}
// a green fork sign: route shield, destinations, and an arrow pointing up-left or up-right
function paintForkSign(lines, dir) {
  const W = 104, H = 46, px = new Pix(W, H);
  px.rect(0, 0, W, H, 0xf4f4f0); px.rect(2, 2, W - 4, H - 4, 0x0f7a4a);
  px.text(lines[0], dir < 0 ? 62 : 42, 4, 15, 0xffffff, { align: 'center', maxW: 64 });
  px.rect(dir < 0 ? 30 : 10, 22, 64, 1, 0xffffff);
  px.text(lines[1], dir < 0 ? 62 : 42, 25, 9, 0xffffff, { align: 'center', maxW: 64, weight: 700 });
  px.text(lines[2], dir < 0 ? 62 : 42, 35, 8, 0xf2e8a0, { align: 'center', maxW: 64, weight: 700 });
  const ax = dir < 0 ? 15 : W - 15;
  px.line(ax, 38, ax, 14, 0xffffff, 3);
  px.line(ax, 14, ax + dir * 8, 6, 0xffffff, 3);
  px.poly(dir < 0 ? [ax - 12, 4, ax - 2, 3, ax - 5, 12] : [ax + 12, 4, ax + 2, 3, ax + 5, 12], 0xffffff);
  px.outline(0x1a1a1a);
  return px;
}

// words painted on the asphalt (seen flat, so drawn stretched along the road)
function paintRoadWord(text) {
  const chars = [...text], W = 24, H = chars.length * 40, px = new Pix(W, H);

function tileWall(px, x, y, w, h, base, kind, rnd) {
  const g1 = shadeHex(base, 0.86), g2 = shadeHex(base, 1.04), g3 = shadeHex(base, 0.94);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    let c = base; const X = x + i, Y = y + j;
    if (kind === 0) { const tx = Math.floor(i / 6), ty = Math.floor(j / 5); c = (i % 6 === 0 || j % 5 === 0) ? g1 : (hash2(tx, ty + seedOf(base)) < 0.25 ? g3 : hash2(tx + 7, ty) < 0.2 ? g2 : base); }
    else if (kind === 1) { const row = Math.floor(j / 6), off = (row % 2) * 6; c = (j % 6 === 0 || (i + off) % 12 === 0) ? g1 : hash2(Math.floor((i + off) / 12), row) < 0.3 ? g3 : base; }
    else c = (j % 10 === 0) ? g3 : base;
    px.set(X, Y, c);
  }
  // rain streaks: Taiwanese walls weather in dark runs below every ledge
  for (let k = 0; k < w / 6; k++) { const sx = x + rnd() * w, sy = y + rnd() * h * 0.8, L = rnd.range(6, 40); for (let j = 0; j < L; j++) if (px.on(sx | 0, (sy + j) | 0)) { const c = px.get(sx | 0, (sy + j) | 0); px.set(sx, sy + j, shadeHex(c, 0.9 + j / L * 0.1)); } }
}

// ===================== tags for the rest of the island: what each new stage stands along its road =====================
// Every handler: (D, s0, s1, sec). Big landmarks sit well back on one side with their sign a little before them.
// a landmark close by the road clears a forecourt before it, so the houses of the street do not stand in front of it
const landmark = (D, s, sg, name, dist, signId, signAt, o) => {
  if (D.sec && D.sec.diverge) return; // the first section is laid twice on a fork child; the landmark stands once
  o = o || {};
  const S = SPR[name] || SPR[pickVar(name, D.rnd)];
  if (S && (dist < 8 || o.gap)) D.gap(s - (o.gap || clamp(S.ww * 2.5, 56, 80)), s + Math.max(8, S.ww * 0.3), sg);
  if (signId) sightSign(D, s - (signAt || 160), sg, signId);
  D.spr(name, s, D.lat(s, sg, dist), { flip: false, collide: false, landmark: true, y: o.y || 0 });
  if(S&&(dist<8||o.gap)&&!o.y){
    // A landmark forecourt clears buildings, not daily life. Small planters
    // and visitors occupy the setback while its entry and pavement stay open.
    for(let j=0;j<3;j++){const q=s-18-j*13;D.spr('planter',q,D.lat(q,sg,4.5+j%2*2),{flip:false,collide:false,landmark:true});}
    for(let j=0;j<2;j++){const q=s-26-j*15;D.spr('walkers',q,D.lat(q,sg,8+j*2),{flip:sg>0,collide:false,landmark:true});}
  }
};
const rowOf = (D, s0, s1, step, jitter, sg, name, d0, d1, o) => every(s0, s1, step, jitter, D.rnd, (s) => D.spr(name, s, D.lat(s, sg, D.rnd.range(d0, d1)), o));

const parade = (D, s, kind) => { if (D.sec && D.sec.diverge) return; (D.p.parades = D.p.parades || []).push({ s, kind, done: false }); };

    every(s0,s1,110,30,D.rnd,s=>{

  },
  // ---------------- 南投 · 集集 ----------------
  jiji(D, s0, s1) { landmark(D, s0 + 220, -1, 'jijistation', 3.2, 'jiji'); D.spr('lamp2', s0 + 196, D.lat(s0 + 196, -1, 1)); D.spr('lamp2', s0 + 244, D.lat(s0 + 244, -1, 1)); },

  jiji_parallel(D, s0, s1) {

// a curve through [t, value] keys, eased between them
function keyed(keys) {
  return (t) => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const a = keys[i - 1], b = keys[i], u = (t - a[0]) / (b[0] - a[0]); return lerp(a[1], b[1], u * u * (3 - 2 * u)); }
    return keys[keys.length - 1][1];
  };
}

// ===================== the ghost: your best run on a route, replayed as a see-through car =====================
const GHOST = {
  rec: [], recT: 0, play: null, car: null, spr: null, p: null, s: 0, x: 0, on: false, name: '', avatar: null, avatarKind: 'face', fx: null, wasAhead: false,
  // a sample every 0.1 s: which piece, how far along it, where across it
  record(dt) {
    if (G.mode !== 'play' || RACE.state !== 'run') return;
    GHOST.recT += dt; if (GHOST.recT < 0.1) return; GHOST.recT -= 0.1;
    GHOST.rec.push([ROUTE.pieces.indexOf(PC.piece), Math.round(PC.s * 10) / 10, Math.round(PC.x * 100) / 100]);
  },
  save(key) { SAVE.save('ghost:' + key, { car: CARS[RACE.carIdx].id, d: GHOST.rec, name: SET.name || '', avatar: SET.avatar || '', avatarKind: SET.avatarKind || 'face' }); SAVE.save('ghost:last', key); },
  // the fastest finished run we have, to race against from the start
  load() {
    const rec = SAVE.load('records', { routes: {} }); let best = null, bk = null;
    for (const k in rec.routes) if (!best || rec.routes[k].t < best.t) { best = rec.routes[k]; bk = k; }
    const g = bk && SAVE.load('ghost:' + bk, null);
    GHOST.play = g && g.d && g.d.length > 10 ? g : null; GHOST.on = !!GHOST.play;
    if (GHOST.on) { const c = CARS.find((q) => q.id === g.car) || CARS[0]; GHOST.spr = carSprites(c); GHOST.car = c; GHOST.name = g.name || SET.name || ''; GHOST.avatarKind = g.avatarKind || SET.avatarKind || 'face'; GHOST.avatar = null; GHOST.fx = null; GHOST.wasAhead = false; avatarDecode(g.avatar || SET.avatar, (im) => { GHOST.avatar = im; }); }
  },
  // where the ghost is RACE.elapsed seconds in; it drops out when its route parts from ours
  update() {
    if (!GHOST.on || G.mode !== 'play') { GHOST.p = null; return; }
    const d = GHOST.play.d, f = RACE.elapsed * 10, i = Math.floor(f);
    if (i >= d.length - 1) { GHOST.p = null; return; }
    const a = d[i], b = d[i + 1], t = f - i, p = ROUTE.pieces[a[0]];
    if (!p) { GHOST.p = null; return; }
    if (a[0] === b[0]) { GHOST.p = p; GHOST.s = lerp(a[1], b[1], t); GHOST.x = lerp(a[2], b[2], t); } else { GHOST.p = p; GHOST.s = a[1]; GHOST.x = a[2]; }
    // the moment we go past it, its portrait gasps (while it is still beside us, in the picture); when it goes past us it grins
    const ahead = GHOST.p === PC.piece ? GHOST.s > PC.s + 10 : (GHOST.p === PC.piece.next || PC.piece.children.includes(GHOST.p));
    if (!ahead && GHOST.wasAhead && RACE.elapsed > 2 && GHOST.p === PC.piece) { badgeSurprise(GHOST, 'gasp'); }
    if (ahead && !GHOST.wasAhead && RACE.elapsed > 2 && GHOST.p === PC.piece) { badgeSurprise(GHOST, 'gasp'); }
    if(GHOST.p===PC.piece)sfxObservePass(GHOST,GHOST.s-PC.s,GHOST.x-PC.x,PC.v-(a[0]===b[0]?(b[1]-a[1])*10/WORLD_K:PC.v),'sedan');
    GHOST.wasAhead = ahead;
    if (GHOST.fx) { GHOST.fx.t += 1 / 60; if (GHOST.fx.t > GHOST.fx.dur) GHOST.fx = null; }
    // only while it is on a piece we can see from here
    if (GHOST.p !== PC.piece && GHOST.p !== PC.piece.next && !PC.piece.children.includes(GHOST.p) && GHOST.p !== PC.piece.parent) GHOST.p = null;
  },
};
